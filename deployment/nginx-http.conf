# Instalar somente como um novo site do UP, após conferir o apontamento DNS.
server {
    listen 80;
    listen [::]:80;
    server_name app.universodoproposito.com;
    root /opt/software-up/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://app.universodoproposito.com$request_uri; }
}

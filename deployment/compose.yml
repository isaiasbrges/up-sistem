name: software-up
services:
  db:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    env_file: private/db.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [up]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 150
    shm_size: 128m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=50]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U up_owner -d software_up]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: software-up-app:20261029
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    env_file:
      - path: private/runtime.env
        format: raw
    ports: ['127.0.0.1:3127:3000']
    depends_on:
      db: {condition: service_healthy}
    networks: [up]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  initialize:
    image: software-up-app:20261029
    profiles: [tools]
    env_file: private/migration.env
    command: [node, deployment/initialize.js]
    depends_on:
      db: {condition: service_healthy}
    networks: [up]
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  db_data:
networks:
  up:
    driver: bridge

# Aplicar após a emissão do certificado exclusivo deste domínio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.universodoproposito.com;
    ssl_certificate /etc/letsencrypt/live/app.universodoproposito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.universodoproposito.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:3127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
